        symbol: 'KiB'
      binaryMebibyte:
        forms:
          default: 'mebibyte'
        symbol: 'MiB'
      binaryGibibyte:
        forms:
          default: 'gibibyte'
        symbol: 'GiB'
      binaryTebibyte:
        forms:
          default: 'tebibyte'
        symbol: 'TiB'
      binaryPebibyte:
        forms:
          default: 'pebibyte'
        symbol: 'PiB'
    timeUnits:
      millisecond:
        symbol: 'ms'
      second:
        symbol: 'sek.'
      minute:
        symbol: 'min.'
      hour:
        symbol: 'time'
      day:
        symbol: 'dag'
      week:
        symbol: 'uke'
      month:
        symbol: 'måned'
      year:
        symbol: 'år'

  number:
    words:
      engine: 'scale-strategy'
      cardinalStrategy: 'norwegian-bokmal'
      ordinalStrategy: 'norwegian-bokmal'
      maximumValue: 9223372036854775807
      defaultGender: 'masculine'
      zeroWord: 'null'
      minusWord: 'minus'
      oneDefault: 'en'
      oneMasculine: 'en'
      oneFeminine: 'ei'
      oneNeuter: 'et'
      tensLinker: 'og'
      largeScaleRemainderJoiner: 'og '
      exactLargeScaleOrdinalSuffix: 'te'
      exactDefaultOrdinalSuffix: 'de'
      tensOrdinalTrimEndCharacters: 'e'
      tensOrdinalSuffix: 'ende'
      shortOrdinalUpperBoundExclusive: 13
      shortOrdinalTrimEndCharacters: 'e'
      shortOrdinalTrimmedSuffix: 'ende'
      shortOrdinalSuffix: 'de'
      hundredWord: 'hundre'
      hundredCompositeSingularWord: 'ethundre'
      thousandWord: 'tusen'
      thousandSingularWord: 'tusen'
      thousandCompositeSingularWord: 'ettusen'
      unitsMap:
        1: 'en'
        2: 'to'
        3: 'tre'
        4: 'fire'
        5: 'fem'
        6: 'seks'
        7: 'sju'
        8: 'åtte'
        9: 'ni'
        10: 'ti'
        11: 'elleve'
        12: 'tolv'
        13: 'tretten'
        14: 'fjorten'
        15: 'femten'
        16: 'seksten'
        17: 'sytten'
        18: 'atten'
        19: 'nitten'
      tensMap:
        1: 'ti'
        2: 'tjue'
        3: 'tretti'
        4: 'førti'
        5: 'femti'
        6: 'seksti'
        7: 'sytti'
        8: 'åtti'
        9: 'nitti'
      hundredUnitMap: []
      scales:
        -
          value: 1000000000000
          name: 'billion'
          plural: 'billioner'
          prefix: ' '
          postfix: ' '
          displayOneUnit: true
          gender: 'masculine'
        -
          value: 1000000000
          name: 'milliard'
          plural: 'milliarder'
          prefix: ' '
          postfix: ' '
          displayOneUnit: true
          gender: 'masculine'
        -
          value: 1000000
          name: 'million'
          plural: 'millioner'
          prefix: ' '
          postfix: ' '
          displayOneUnit: true
          gender: 'masculine'
      ordinalExceptions:
        0: 'nullte'
        1: 'første'
        2: 'andre'
        3: 'tredje'
        4: 'fjerde'
        5: 'femte'
        6: 'sjette'
        11: 'ellevte'
        12: 'tolvte'

    formatting:
      negativeSign: '−'

    parse:
      decimalMarker: 'komma'
      engine: 'compound-scale'
      cardinalMap:
        'null': 0
        en: 1
        ei: 1
        et: 1
        to: 2
        tre: 3
        fire: 4
        fem: 5
        seks: 6
        sju: 7
        'åtte': 8
        ni: 9
        ti: 10
        elleve: 11
        tolv: 12
        tretten: 13
        fjorten: 14
        femten: 15
        seksten: 16
        sytten: 17
        atten: 18
        nitten: 19
        tjue: 20
        tretti: 30
        'førti': 40
        femti: 50
        seksti: 60
        sytti: 70
        'åtti': 80
        nitti: 90
        hundre: 100
        tusen: 1000
        million: 1000000
        millioner: 1000000
        milliard: 1000000000
        milliarder: 1000000000
      tens:
        - 'tjue'
        - 'tretti'
        - 'førti'
        - 'femti'
        - 'seksti'
        - 'sytti'
        - 'åtti'
        - 'nitti'
      largeScales:
        - 'milliard'
        - 'millioner'
        - 'million'
        - 'tusen'
        - 'hundre'
      ignoredToken: 'og'
      ordinalNumberToWordsKind: 'self'
      negativePrefixes:
        - 'minus '

  ordinal:
    numeric:
      engine: 'suffix'
      masculineSuffix: '.'
      feminineSuffix: '.'
      neuterSuffix: '.'

    date:
      engine: 'pattern'
      pattern: '{day} MMMM yyyy'
      dayMode: 'DotSuffix'
    dateOnly:
      engine: 'pattern'
      pattern: '{day} MMMM yyyy'
      dayMode: 'DotSuffix'

  clock:
    engine: 'phrase-clock'
    hourMode: 'h24'
    hourGender: 'neuter'
    hourOneWord: 'ett'
    zeroFiller: 'null'
    defaultTemplate: '{hour} {minutes}'

  compass:
