  number:
    words:
      engine: 'harmony-ordinal'
      minimumValue: -9223372036854775807
      maximumValue: 9223372036854775807
      minusWord: 'минус'
      hundredWord: 'жүз'
      hundredStrategy: 'omit-one-when-singular'
      unitsMap:
        - 'нөл'
        - 'бір'
        - 'екі'
        - 'үш'
        - 'төрт'
        - 'бес'
        - 'алты'
        - 'жеті'
        - 'сегіз'
        - 'тоғыз'
      tensMap:
        - 'нөл'
        - 'он'
        - 'жиырма'
        - 'отыз'
        - 'қырық'
        - 'елу'
        - 'алпыс'
        - 'жетпіс'
        - 'сексен'
        - 'тоқсан'
      ordinalSuffixStrategy: 'last-vowel-map'
      softenTerminalTBeforeSuffix: false
      dropTerminalVowelBeforeHarmonySuffix: false
      ordinalSuffixes:
        а: 'ыншы'
        ә: 'інші'
        е: 'інші'
        і: 'інші'
        о: 'ыншы'
        ө: 'інші'
        ұ: 'ыншы'
        ү: 'інші'
        ы: 'ыншы'
      terminalVowelOrdinalSuffixes:
        а: 'сыншы'
        і: 'нші'
        ы: 'ншы'
      scales:
        -
          value: 1000000000000000000
          name: 'квинтиллион'
        -
          value: 1000000000000000
          name: 'квадриллион'
        -
          value: 1000000000000
          name: 'триллион'
        -
          value: 1000000000
          name: 'миллиард'
        -
          value: 1000000
          name: 'миллион'
        -
          value: 1000
          name: 'мың'
    parse:
      engine: 'token-map'
      normalizationProfile: 'CollapseWhitespace'
      cardinalMap:
        'нөл': 0
        'бір': 1
        'екі': 2
        'үш': 3
        'төрт': 4
        'бес': 5
        'алты': 6
        'жеті': 7
        'сегіз': 8
        'тоғыз': 9
        'он': 10
        'жиырма': 20
        'отыз': 30
        'қырық': 40
        'елу': 50
        'алпыс': 60
        'жетпіс': 70
        'сексен': 80
        'тоқсан': 90
        'жүз': 100
        'мың': 1000
        'миллион': 1000000
        'миллиард': 1000000000
        'триллион': 1000000000000
        'квадриллион': 1000000000000000
        'квинтиллион': 1000000000000000000
      useHundredMultiplier: true
      negativePrefixes:
        - 'минус '
      tokenSuffixesToStrip:
        - 'сыншы'
        - 'сінші'
        - 'ыншы'
        - 'інші'
        - 'ншы'
        - 'нші'
    formatting:
      decimalSeparator: ','
      groupSeparator: ' '
      negativeSign: '-'

  ordinal:
    numeric:
      engine: 'modulo-suffix'
      defaultSuffix: '-шы'
      useAbsoluteValue: true
      lastDigitSuffixes:
        1: '-ші'
        2: '-ші'
        3: '-ші'
        4: '-ші'
        5: '-ші'
        7: '-ші'
        8: '-ші'
