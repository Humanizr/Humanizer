            forms:
              default: 'måneder'
            afterCount: 'fra nu'
        year:
          single: 'et år fra nu'
          multiple:
            forms:
              default: 'år'
            afterCount: 'fra nu'
    duration:
      zero: 'ingen tid'
      age:
        template: '{value} gammel'
      millisecond:
        single:
          numeric: 'et millisekund'
          words: 'et millisekund'
        multiple:
          forms:
            default: 'millisekunder'
      second:
        single:
          numeric: 'et sekund'
          words: 'et sekund'
        multiple:
          forms:
            default: 'sekunder'
      minute:
        single:
          numeric: 'et minut'
          words: 'et minut'
        multiple:
          forms:
            default: 'minutter'
      hour:
