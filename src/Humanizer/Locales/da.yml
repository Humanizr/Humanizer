        - 'millioner'
        - 'million'
        - 'billioner'
        - 'billion'
        - 'billiarder'
        - 'billiard'
        - 'trillioner'
        - 'trillion'
        - 'tusind'
        - 'hundrede'
      negativePrefixes:
        - 'minus '
      ignoredTokens:
        - 'og'
      allowInvariantIntegerInput: true

  ordinal:
    numeric:
      engine: 'suffix'
      masculineSuffix: '.'
      feminineSuffix: '.'
      neuterSuffix: '.'

    date:
      engine: 'pattern'
      pattern: '{day} MMMM yyyy'
      dayMode: 'DotSuffix'
    dateOnly:
      engine: 'pattern'
      pattern: '{day} MMMM yyyy'
      dayMode: 'DotSuffix'

  clock:
    engine: 'phrase-clock'
    hourMode: 'h24'
    hourGender: 'neuter'
    zeroFiller: 'nul'
    defaultTemplate: '{hour} {minutes}'

  compass:
    full:
      - 'nord'
      - 'nordnordøst'
      - 'nordøst'
      - 'østnordøst'
      - 'øst'
      - 'østsydøst'
      - 'sydøst'
      - 'sydsydøst'
      - 'syd'
      - 'sydsydvest'
      - 'sydvest'
      - 'vestsydvest'
      - 'vest'
      - 'vestnordvest'
      - 'nordvest'
      - 'nordnordvest'
    short:
      - 'N'
