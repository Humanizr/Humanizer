                single:
                  numeric: '1 minuts'
                multiple:
                  countPlacement: none
                  forms:
                    default: '{count} minutters'
                    singular: '{count} minuts'
                    dual: '{count} minutters'
                    paucal: '{count} minutters'
                    plural: '{count} minutters'
              provenance:
                - 'cldr48'
            hour:
              phrase:
                single:
                  numeric: '1 times'
                multiple:
                  countPlacement: none
                  forms:
                    default: '{count} timers'
                    singular: '{count} times'
                    dual: '{count} timers'
                    paucal: '{count} timers'
                    plural: '{count} timers'
              provenance:
                - 'cldr48'
            day:
              phrase:
                single:
                  numeric: '1 dags'
                multiple:
                  countPlacement: none
                  forms:
                    default: '{count} dages'
                    singular: '{count} dags'
                    dual: '{count} dages'
                    paucal: '{count} dages'
                    plural: '{count} dages'
              provenance:
                - 'cldr48'
            week:
