        credit: 'Unicode CLDR contributors'
    cases:
      nominative:
        authored: 'base-duration'
        provenance:
          - 'cldr48'
      genitive:
        authored:
          units:
            millisecond:
              phrase:
                single:
                  numeric: '1 millisekunds'
                multiple:
                  countPlacement: none
                  forms:
                    default: '{count} millisekunders'
                    singular: '{count} millisekunds'
                    dual: '{count} millisekunders'
                    paucal: '{count} millisekunders'
                    plural: '{count} millisekunders'
              provenance:
                - 'cldr48'
            second:
