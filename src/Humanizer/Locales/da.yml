                single:
                  numeric: '1 måneds'
                multiple:
                  countPlacement: none
                  forms:
                    default: '{count} måneders'
                    singular: '{count} måneds'
                    dual: '{count} måneders'
                    paucal: '{count} måneders'
                    plural: '{count} måneders'
              provenance:
                - 'cldr48'
            year:
              phrase:
                single:
                  numeric: '1 års'
                multiple:
                  countPlacement: none
                  forms:
                    default: '{count} års'
                    singular: '{count} års'
                    dual: '{count} års'
                    paucal: '{count} års'
                    plural: '{count} års'
              provenance:
                - 'cldr48'
        provenance:
          - 'cldr48'

  list:
    engine: 'conjunction'
    value: 'og'

  phrases:
    relativeDate:
      now: 'nu'
      never: 'aldrig'
      past:
        millisecond:
          single: 'et millisekund siden'
          multiple:
            forms:
              default: 'millisekunder'
            afterCount: 'siden'
        second:
          single: 'et sekund siden'
          multiple:
            forms:
              default: 'sekunder'
            afterCount: 'siden'
        minute:
          single: 'et minut siden'
          multiple:
            forms:
              default: 'minutter'
            afterCount: 'siden'
        hour:
          single: 'en time siden'
          multiple:
            forms:
              default: 'timer'
            afterCount: 'siden'
        day:
          single: 'i går'
          multiple:
