            afterCount: 'fra nu'
        hour:
          single: 'en time fra nu'
          multiple:
            forms:
              default: 'timer'
            afterCount: 'fra nu'
        day:
          single: 'i morgen'
          multiple:
            forms:
              default: 'dage'
            afterCount: 'fra nu'
