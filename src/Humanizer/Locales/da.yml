        elleve: 11
        tolv: 12
        tretten: 13
        fjorten: 14
        femten: 15
        seksten: 16
        sytten: 17
        atten: 18
        nitten: 19
        tyve: 20
        tredive: 30
        fyrre: 40
        halvtreds: 50
        tres: 60
        halvfjerds: 70
        firs: 80
        halvfems: 90
        hundrede: 100
        tusind: 1000
        million: 1000000
        millioner: 1000000
        milliard: 1000000000
        milliarder: 1000000000
        billion: 1000000000000
        billioner: 1000000000000
        billiard: 1000000000000000
        billiarder: 1000000000000000
