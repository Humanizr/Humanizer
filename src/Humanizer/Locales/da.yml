                single:
                  numeric: '1 uges'
                multiple:
                  countPlacement: none
                  forms:
                    default: '{count} ugers'
                    singular: '{count} uges'
                    dual: '{count} ugers'
                    paucal: '{count} ugers'
                    plural: '{count} ugers'
