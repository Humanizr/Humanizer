        symbol: 'b'
      byte:
        forms:
          default: 'byte'
        symbol: 'B'
      kilobyte:
        forms:
          default: 'kilobyte'
        symbol: 'KB'
      megabyte:
        forms:
          default: 'megabyte'
        symbol: 'MB'
      gigabyte:
        forms:
          default: 'gigabyte'
        symbol: 'GB'
      terabyte:
        forms:
          default: 'terabyte'
        symbol: 'TB'
    timeUnits:
      millisecond:
        symbol: 'ms'
      second:
        symbol: 'sek.'
      minute:
        symbol: 'min.'
      hour:
        symbol: 'time'
      day:
        symbol: 'dag'
      week:
        symbol: 'uge'
      month:
        symbol: 'måned'
      year:
        symbol: 'år'

  number:
    words:
      engine: 'inverted-tens'
      minusWord: 'minus'
      unitsMap:
        - 'nul'
        - 'en'
        - 'to'
        - 'tre'
        - 'fire'
        - 'fem'
        - 'seks'
        - 'syv'
        - 'otte'
        - 'ni'
        - 'ti'
        - 'elleve'
        - 'tolv'
        - 'tretten'
        - 'fjorten'
        - 'femten'
        - 'seksten'
        - 'sytten'
        - 'atten'
        - 'nitten'
      tensMap:
        1: 'ti'
        2: 'tyve'
        3: 'tredive'
        4: 'fyrre'
        5: 'halvtreds'
        6: 'tres'
        7: 'halvfjerds'
        8: 'firs'
        9: 'halvfems'
      hundredsPrefixMap:
        1: 'et'
        2: 'to'
        3: 'tre'
        4: 'fire'
        5: 'fem'
        6: 'seks'
        7: 'syv'
        8: 'otte'
        9: 'ni'
      oneHundredWord: 'et hundrede'
      hundredWord: 'hundrede'
      hundredJoiner: ' '
      hundredRemainderSeparator: ' og '
      scaleTailPrefix: 'og '
      scaleTailPrefixMode: 'sub-hundred'
      hundredTailPrefixMode: 'none'
      unitTensJoiner: 'og'
      scales:
        -
          value: 1000000000000000000
          oneForm: 'en trillion'
          manyForm: 'trillioner'
          countJoiner: ' '
          remainderSeparator: ' '
        -
          value: 1000000000000000
          oneForm: 'en billiard'
          manyForm: 'billiarder'
          countJoiner: ' '
          remainderSeparator: ' '
        -
          value: 1000000000000
          oneForm: 'en billion'
          manyForm: 'billioner'
          countJoiner: ' '
          remainderSeparator: ' '
        -
          value: 1000000000
          oneForm: 'en milliard'
          manyForm: 'milliarder'
          countJoiner: ' '
          remainderSeparator: ' '
        -
          value: 1000000
          oneForm: 'en million'
          manyForm: 'millioner'
          countJoiner: ' '
          remainderSeparator: ' '
        -
          value: 1000
          oneForm: 'et tusind'
          manyForm: 'tusind'
          countJoiner: ' '
          remainderSeparator: ' '
