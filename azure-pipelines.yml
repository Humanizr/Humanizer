trigger:
- main
- rel/*

pr:
- main
- rel/*

variables:
  BuildConfiguration: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

stages:
- stage: Build
  variables:
  - group: 'Report Generator License Key'

  jobs:
  - job: Build
    pool:
      vmImage: windows-latest

    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: 8.x

    - task: UseDotNet@2
      displayName: 'Use .NET 9 SDK'
      inputs:
        version: 9.x

    - task: UseDotNet@2
      displayName: 'Use .NET 10 SDK'
      inputs:
        version: 10.x

    - task: UseDotNet@2
      displayName: 'Use .NET 11 SDK'
      inputs:
        version: 11.0.100-preview.6.26359.118

    - task: DotNetCoreCLI@2
      inputs:
        command: custom
        custom: tool
        arguments: install --tool-path . nbgv
      displayName: Install NBGV tool

    - script: nbgv cloud -c -a
      displayName: Set Version

    - task: DotNetCoreCLI@2
      inputs:
        command: pack
        packagesToPack: ./src/Humanizer/Humanizer.csproj
        packDirectory: $(Build.ArtifactStagingDirectory)/Packages
        configuration: $(BuildConfiguration)
      displayName: Restore, Build, and Pack

    - pwsh: |
        $(Build.SourcesDirectory)/tests/verify-packages.ps1 `
          -PackageVersion '$(NBGV_NuGetPackageVersion)' `
          -PackagesDirectory '$(Build.ArtifactStagingDirectory)/Packages'
      displayName: Verify Package Structure and Dependencies
      failOnStderr: false

    - task: DotNetCoreCLI@2
      inputs:
        command: custom
        custom: test
        arguments: >-
          --solution Humanizer.slnx
          -c $(BuildConfiguration)
          --coverage --coverage-output-format cobertura
          --report-trx --xunit-info
          --results-directory "$(Agent.TempDirectory)/humanizer-test-results"
      displayName: Run Tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/humanizer-test-results/**/*.trx'
        testRunTitle: Humanizer Windows package build
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true

    # Generate code coverage report
    # https://danielpalme.github.io/ReportGenerator/
    - task: reportgenerator@5
      displayName: Generate Code Coverage Report
      condition: succeededOrFailed()
      inputs:
        reports: '$(Agent.TempDirectory)/**/*.cobertura.xml'
        sourcedirs: $(Build.SourcesDirectory)
        targetdir: $(Build.ArtifactStagingDirectory)/coverageReports/
        reporttypes: HtmlInline_AzurePipelines_Dark;Cobertura;Badges
        license: '$(ReportGeneratorLicenseKey)'
        customSettings: 'settings:rawMode=false'
        publishCodeCoverageResults: true

    - publish: $(Build.ArtifactStagingDirectory)/Packages
      displayName: Publish build packages
      artifact: BuildPackages
      condition: succeededOrFailed()


  - job: RuntimeValidation
    displayName: Runtime platform validation
    strategy:
      matrix:
        LinuxICU:
          VmImage: ubuntu-latest
          PlatformName: LinuxICU
          UseNls: '0'
        WindowsNLS:
          VmImage: windows-latest
          PlatformName: WindowsNLS
          UseNls: '1'
    pool:
      vmImage: $(VmImage)
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        version: 8.x

    - task: UseDotNet@2
      displayName: 'Use .NET 10 SDK'
      inputs:
        version: 10.x

    - task: UseDotNet@2
      displayName: 'Use .NET 11 SDK'
      inputs:
        version: 11.0.100-preview.6.26359.118

    - task: DotNetCoreCLI@2
      displayName: Record runner SDK
      inputs:
        command: custom
        custom: --info

    - task: DotNetCoreCLI@2
      displayName: Run runtime, generator, and analyzer tests
      inputs:
        command: custom
        custom: test
        arguments: >-
          --solution Humanizer.slnx
          -c $(BuildConfiguration)
          --report-trx
          --results-directory "$(Agent.TempDirectory)/humanizer-test-results"
      env:
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '0'
        DOTNET_SYSTEM_GLOBALIZATION_USENLS: $(UseNls)

    - task: PublishTestResults@2
      displayName: Publish $(PlatformName) test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/humanizer-test-results/**/*.trx'
        testRunTitle: Humanizer $(PlatformName)
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true

    - publish: $(Agent.TempDirectory)/humanizer-test-results
      displayName: Preserve $(PlatformName) test artifacts
      artifact: RuntimeValidation-$(PlatformName)
      condition: succeededOrFailed()

- stage: CodeSign
  dependsOn: Build
  condition: and(succeeded('Build'), not(eq(variables['build.reason'], 'PullRequest')))
  jobs:
  - job: CodeSign
    displayName: Code Signing
    pool:
      vmImage: windows-latest
    variables:
    - group: SignCLI Creds

    steps:

    # Retreive unsigned artifacts 
    - download: current
      artifact: BuildPackages
      displayName: Download build artifacts

    - task: UseDotNet@2
      displayName: 'Use .NET 11 SDK'
      inputs:
        version: 11.0.100-preview.6.26359.118

    # Install the code signing tool
    - task: DotNetCoreCLI@2
      inputs:
        command: custom
        custom: tool
        arguments: install --tool-path . --prerelease sign 
      displayName: Install SignTool tool

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'AzureRM - Humanizr'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          .\sign code azure-key-vault `
          "**/*.nupkg" `
          --base-directory "$(Pipeline.Workspace)\BuildPackages" `
          --publisher-name "Humanizer" `
          --description "Humanizer" `
          --description-url "https://github.com/Humanizr/Humanizer" `
          --azure-key-vault-certificate "$(SignKeyVaultCertificate)" `
          --azure-key-vault-url "$(SignKeyVaultUrl)"
      displayName: Sign packages
    
    # Publish the signed packages
    - publish: $(Pipeline.Workspace)/BuildPackages
      displayName: Publish Signed Packages
      artifact: SignedPackages
